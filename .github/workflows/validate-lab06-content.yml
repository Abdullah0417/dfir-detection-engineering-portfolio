name: validate-lab06-content

on:
  workflow_dispatch:
  pull_request:
  push:
    paths:
      - '.github/workflows/validate-lab06-content.yml'
      - '.github/workflows/package-lab06-content.yml'
      - '.github/workflows/lab06-oidc-smoke-test.yml'
      - '.github/workflows/deploy-lab06-test.yml'
      - 'labs/06-entra-id-detection-engineering-gated-content-pipeline/**'
      - 'labs/07-aws-guardduty-detection-response/automation/response/**'
      - 'labs/03-controls-to-telemetry-audit/notes/*.ps1'
      - 'tests/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      LAB06_DIR: labs/06-entra-id-detection-engineering-gated-content-pipeline
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validator dependency
        run: python -m pip install --upgrade pip pyyaml

      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate repo structure and hygiene
        run: python "${LAB06_DIR}/scripts/validate_repo.py" "${LAB06_DIR}"

      - name: Validate deployable JSON
        run: python "${LAB06_DIR}/scripts/validate_deployable_json.py" "${LAB06_DIR}"

      - name: Validate detection metadata
        run: python "${LAB06_DIR}/scripts/validate_detection_metadata.py" "${LAB06_DIR}"

      - name: Validate workflow guardrails
        run: python "${LAB06_DIR}/scripts/validate_workflow_guardrails.py" "${LAB06_DIR}"

      - name: Validate README evidence
        run: python "${LAB06_DIR}/scripts/validate_readme_evidence.py" "${LAB06_DIR}"

  harness-tests:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Pester
        run: Install-Module Pester -RequiredVersion 5.7.1 -Repository PSGallery -Scope CurrentUser -Force -SkipPublisherCheck -ErrorAction Stop
      - name: Parse PowerShell and run mocked harness tests
        run: |
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) { throw ($errors | Out-String) }
          }
          Import-Module Pester -RequiredVersion 5.7.1
          Invoke-Pester -Path ./tests/Lab03Harness.Tests.ps1 -CI -Output Detailed
